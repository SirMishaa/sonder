        "400":
          description: Invalid parameters
        "404":
          description: No credits for this IPI
        "503":
          description: Database unavailable
      summary: Registration eligibility for a songwriter IPI
      description: Per-song verdict (eligible | ineligible) gated on the
        verified_publishers table. A song is ineligible when any credited
        publisher's IPI is in verified_publishers. Blockers list the verified
        publisher(s) that caused the ineligible verdict.
  /v1/ipi/{ipi}/summary:
    get:
      tags:
        - Lookups
      parameters:
        - in: path
          name: ipi
          required: true
          schema:
            type: string
            pattern: ^\d{9,11}$
            example: "00177337244"
      responses:
        "200":
          description: Summary payload
        "400":
          description: Invalid IPI
        "404":
          description: No catalog data found for this IPI
        "503":
          description: Database unavailable
      summary: Catalog verify summary for an IPI
      description: "Single-call summary used by the Catalog Verify hero: counts +
        top-5 samples for writers (publisher mode), publishers (songwriter
        mode), works (ISWCs), recordings (ISRCs), releases (UPCs), and linked
        ISNIs. Branches internally on entity_type."
  /v1/ipi/{ipi}/works:
    get:
      tags:
        - Lookups
      parameters:
        - in: path
          name: ipi
          required: true
          schema:
            type: string
            pattern: ^\d{9,11}$
            example: "00177337244"
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - in: query
          name: offset
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Ranked works list
        "400":
          description: Invalid IPI format
        "404":
          description: No works found for this IPI
        "503":
          description: Database unavailable
      summary: Ranked works (ISWCs) for an IPI
      description: Returns works attributable to this IPI. Songwriter/artist rows are
        verified against each work's songwriter payload; false or
        performer-derived IPI links are excluded. Originals rank before
        sample/interpolation credits, then by recording count. `original_works`
        and `also_credited` split the paged result. Publisher works are
        aggregated from the publisher catalog (ISRCs → ISWCs). Triggers a
        fire-and-forget graph-link verification queue entry on each call.
  /v1/isni/{isni}:
    get:
      tags:
        - Lookups
      parameters:
        - in: path
          name: isni
          required: true
          schema:
            type: string
            pattern: ^\d{15}[\dX]$
            example: "0000000000012571"
          description: 16-character ISNI (spaces/dashes stripped; last digit may be **X**).
      responses:
        "400":
          description: Invalid or missing ISNI
        "404":
          description: ISNI not found
        "503":
          description: Database unavailable
      summary: Get ISNI
      description: "**Canonical ISNI URL.** Default: flat **`IsniDetailResponse`** —
        name, entity type, roles, linked IPIs, sample works/recordings, and
        **`recordings_url`** → **`GET /v1/isni/{isni}/recordings`** (full
        paginated list). Falls back to MusicBrainz when not in index. With
        **`graph=1`** or any of **`include`**, **`relationships`**,
        **`relationship`**, **`depth`**: Music Identity graph (legacy **`GET
        /v1/artists/{isni}`** **308**s here); e.g. **`?include=recordings`**
        selects only that connection without enabling flat pagination mode.
        **`limit` / `offset` alone** (no graph keys) paginate flat **`isrcs`** /
        **`iswcs`** slices only. Optional contribution hints unless
        **`?contribute=false`**."
  /v1/isni/{isni}/recordings:
    get:
      tags:
        - Lookups
      parameters:
        - in: path
          name: isni
          required: true
          schema:
            type: string
            example: "0000000000012571"
          description: 16-character ISNI (last char may be X).
        - in: query
          name: limit
          required: false
          schema:
            type: integer
        - in: query
          name: offset
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of recordings to skip (paginate the deduped, sorted list).
      responses:
        "200":
          description: Recordings list (may be empty if ISNI has none linked).
        "400":
          description: Invalid ISNI.
        "404":
          description: ISNI not found.
        "503":
          description: Database unavailable.
      summary: Get recordings for an ISNI
      description: Returns the full ISRC list for an ISNI's recordings, paginated and
        enriched with recording title, artist names, ISWC, and songwriters.
        Walks `mb_artist_isnis → mb_artist_credits → mb_recordings → mb_isrcs`,
        dedupes by ISRC, and joins `isrc_index` for metadata. Use `?limit=5000`
        for catalog dumps.
  /v1/isrc/{isrc}:
    get:
      tags:
        - Lookups
      parameters:
        - in: path
          name: isrc
          required: true
          schema:
            type: string
            pattern: ^[A-Z]{2}[A-Z0-9]{3}\d{7}$
            example: GBAYE0601498
          description: 12-character ISRC (dashes/spaces stripped before validation).
            Response fields are **snake_case** (`recording_title`, …).
      responses:
        "400":
          description: Invalid or missing ISRC
        "404":
          description: ISRC not found
        "503":
          description: Database unavailable
      summary: Get ISRC
      description: "**Canonical ISRC URL.** Default: flat **`IsrcDetailResponse`**
        plus optional contribution hints. With graph query keys (**`graph=1`**,
        **`include`**, **`limit`**, …): Music Identity graph (legacy **`GET
        /v1/recordings/{isrc}`** **308**s here) **plus the same flat scalar
        fields** (songwriters, performers, MLC fields, sources, …) so graph mode
        is a superset of the flat document."
  /v1/isrc/{isrc}/mlc-live:
    get:
      tags:
        - Lookups
      parameters:
        - in: path
          name: isrc
          required: true
          schema:
            type: string
            pattern: ^[A-Z]{2}[A-Z0-9]{3}\d{7}$
            example: USRC12003364
          description: 12-character ISRC
        - in: query
          name: refresh
          required: false
          schema:
            type: boolean
            default: false
          description: Bypass the 14-day cache and force a fresh MLC API call
      responses:
        "200":
          description: "MLC works for this ISRC (source: cache | live | stale |
            unavailable)"
        "400":
          description: Invalid ISRC
        "503":
          description: Database unavailable
      summary: Live MLC Public Work Search by ISRC
      description: 'Cache-aware live MLC Public Work Search lookup for this ISRC. This
        is separate from the scheduled MLC Bulk Feed (Bulk Data Access)
        pipeline, which enriches the shared index tables. Returns work(s) with
        writer chains, ISWCs, publishers, and alternative titles. Cached 14 days
        — pass `?refresh=true` to force a fresh MLC fetch. `source` is `cache` |
        `live` | `stale` | `unavailable`. An empty `works` array means no MLC
        registration (or MLC is temporarily unavailable — `source:
        "unavailable"`). Always 200 unless the database is unavailable.'
  /v1/isrc/{isrc}/relationships:
    get:
      tags:
        - Relationships
      parameters:
        - in: path
          name: isrc
          required: true
          schema:
            type: string
            example: USUM71710485
          description: 12-character ISRC
        - in: query
          name: type
          required: false
          schema:
            type: string
          description: Filter to one relation_type (cover, sample, interpolation, ...).
            Omit for all.
        - in: query
          name: direction
          required: false
          schema:
            type: string
            enum:
              - from
              - to
              - both
            default: both
          description: Relationship direction relative to the ISRC
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - in: query
          name: offset
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Aggregated relationships with source attribution
        "400":
          description: Invalid ISRC or query param
        "503":
          description: Database unavailable
      summary: Get typed relationships for an ISRC
      description: Returns directed typed relationships (cover / sample /
        interpolation / translation / medley / remix / live / etc.) involving
        this ISRC. Each relationship is sourced from one or more upstream
        catalogs (MusicBrainz, SecondHandSongs, Discogs, etc.) — aggregated rows
        include the union of sources backing the relationship.
  /v1/iswc/{iswc}:
    get:
      tags:
        - Lookups
      parameters:
        - in: path
          name: iswc
          required: true
          schema:
            type: string
            example: T-010434240-6
          description: ISWC in **`T-#########-#`** form or compact **`T##########`**
            (normalized server-side). Response fields are **snake_case**
            (`song_title`, `isrc_count`, …).
      responses:
        "400":
          description: Invalid or missing ISWC
        "404":
          description: ISWC not found
        "503":
          description: Database unavailable
      summary: Get ISWC
      description: "**Canonical ISWC URL.** Without graph query keys: flat
        **`IswcDetailResponse`** (snake_case) plus optional contribution hints.
        With **`graph=1`** or **`include`** / **`relationships`** / **`limit`**
        / **`offset`** / **`depth`**: Music Identity **graph** JSON (same
        behavior as legacy **`GET /v1/songs/{iswc}`**, which **308**s to this
        path), **including flat work fields** (`songwriters`,
        `songwriter_count`, `isrc_count`, `updated_at`, …) alongside
        relationship arrays."
  /v1/iswc/{iswc}/related-works:
    get:
      tags:
        - Compositions
      parameters:
        - in: path
          name: iswc
          required: true
          schema:
            type: string
            example: T-928-760-686-4
          description: ISWC in T-#########-# or compact T########## form. Normalized
            server-side.
      responses:
        "200":
          description: Related-works group including this ISWC.
        "400":
          description: Invalid ISWC.
        "404":
          description: ISWC not found in any group.
        "503":
          description: Database unavailable.
      summary: Get related-works group for ISWC
      description: Returns the related-works group containing this ISWC. A group
        groups ISWCs and MLC Song Codes that represent the same musical work.
        404 when the ISWC is in our index but not yet grouped (no duplicate
        registrations found).
  /v1/iswc/{iswc}/relationships:
    get:
      tags:
        - Relationships
      parameters:
        - in: path
          name: iswc
          required: true
          schema:
            type: string
            example: T-928-760-686-4
          description: ISWC in T-#########-# or T########## form
        - in: query
          name: type
          required: false
          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - in: query
          name: offset
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Aggregated relationships with source attribution
        "400":
          description: Invalid ISWC or query param
        "503":
          description: Database unavailable
      summary: Get typed relationships for an ISWC
      description: Returns directed typed relationships involving any ISRC tied to
        this ISWC. Relationships are sourced from one or more upstream catalogs
        (MusicBrainz, SecondHandSongs, Discogs).
  /v1/jobs/{job_id}:
    get:
      tags:
        - Enrich
      parameters:
        - in: path
          name: job_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Key-scoped job state, counters, events, and result
        "401":
          description: API key required or invalid
        "404":
          description: Job not found for this API key
      summary: Get an Enrich job
      security:
        - ApiKeyAuth: []
  /v1/jobs:
    get:
      tags:
        - Enrich
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 25
      responses:
        "200":
          description: Recent jobs belonging to the supplied API key
        "401":
          description: API key required or invalid
      summary: List recent Enrich jobs
      security:
        - ApiKeyAuth: []
  /v1/keys:
    options:
      tags:
        - App Routes
      parameters: []
      responses:
        "200":
          description: OK
    post:
      tags:
        - API keys
      parameters: []
      responses:
        "201":
          description: Key created (key, prefix, name, created_at, limits)
        "400":
          description: Invalid body
        "409":
          description: Max keys per email exceeded
        "429":
          description: Too many key creation requests from this IP
        "503":
          description: Database unavailable
      summary: Create API key
      description: Create the API key required by `POST /v1/contribute` (name and
        email required). Verify, Crowd, and Compute do not need a key. Returns
        the raw `cfm_` key once — store it securely. Max 3 active keys per
        email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                email:
                  type: string
                  format: email
                contributor_name:
                  type: string
                contributor_url:
                  type: string
                  format: uri
  /v1/lookup:
    get:
      tags:
        - Lookup
      parameters:
        - in: query
          name: url
          required: true
          schema:
            type: string
            format: uri
          description: Spotify or Apple Music URL
      responses:
        "200":
          description: Resolved track, album, or artist hint
        "400":
          description: Missing or unsupported URL
        "404":
          description: Resource not found on platform
        "500":
          description: Internal error
        "503":
          description: Spotify not configured or unavailable
      summary: Resolve URL (Spotify / Apple Music)
      description: Resolve Spotify or Apple Music URLs to track/album metadata and
        identifiers. Spotify requires client credentials; ISRC backfill uses
        Supabase when set (`NITRO_PUBLIC_BASE_URL` for credits links).
  /v1/mcp:
    delete:
      tags:
        - MCP
      parameters: []
      responses:
        "200":
          description: OK
      summary: MCP session teardown (DELETE)
      description: JSON-RPC session cleanup when supported.
    get:
      tags:
        - MCP
      parameters:
        - in: header
          name: Accept
          required: false
          schema:
            type: string
          description: Use `text/html` to redirect to Scalar `/docs`
      responses:
        "200":
          description: JSON MCP metadata
        "302":
          description: Redirect to /docs when Accept is text/html
      summary: MCP discovery (GET)
      description: "Without `Accept: text/html`, returns JSON transport metadata
        (`protocolVersion`, `apiBase: /v1`). With `Accept: text/html`, redirects
        to **/docs** (Scalar)."
    options:
      tags:
        - MCP
      parameters: []
      responses:
        "200":
          description: OK
      summary: MCP CORS preflight (OPTIONS)
    post:
      tags:
        - MCP
      parameters: []
      responses:
        "200":
          description: JSON-RPC result object, array of results, or JSON-RPC error
        "204":
          description: No content (e.g. notification with no reply)
      summary: MCP JSON-RPC over HTTP
      description: "Model Context Protocol (stateless). POST JSON-RPC 2.0:
        `initialize`, `tools/list`, `tools/call`. Tools call this host's REST
        API under **/v1/**. Optional **x-api-key** header for higher rate
        limits. Lookup tools include contribution nudges by default; pass
        **`contribute: false`** in tool arguments to opt out."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Single JSON-RPC object or an array of requests (batch)
              oneOf:
                - type: object
                  required:
                    - jsonrpc
                    - method
                  properties:
                    jsonrpc:
                      type: string
                      enum:
                        - "2.0"
                    id: {}
                    method:
                      type: string
                    params:
                      type: object
                      additionalProperties: true
                - type: array
                  items:
                    type: object
                    additionalProperties: true
  /v1/me:
    get:
      tags:
        - Contributions
      parameters:
        - in: query
          name: session_id
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Your earned tier and contribution totals
        "503":
          description: Database unavailable
      summary: Your Credits Compute status
      description: Returns your earned Credits Compute tier and contribution totals.
        Identify with an API key (`x-api-key`) and/or an anonymous compute
        session (`?session_id=`). Contributing verified work raises your `tier`.
  /v1/me/claims:
    get:
      tags:
        - Account & Claims
      parameters:
        - in: query
          name: session_id
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Your claims
        "400":
          description: Missing or invalid session_id
        "429":
          description: Rate limit exceeded
        "503":
          description: Database unavailable
      summary: List your claims
      description: The identifiers claimed by your compute session (`?session_id=` or
        `x-compute-session` header), each with its `verification` trust signal
        (`unverified` | `compute_verified` | `owner_verified`).
    post:
      tags:
        - Account & Claims
      parameters: []
      responses:
        "200":
          description: Already claimed (idempotent)
        "201":
          description: Claim created
        "400":
          description: Invalid session, type, or code
        "404":
          description: Code not found in the Credits index
        "409":
          description: Claim cap (24) reached
        "429":
          description: Rate limit exceeded
        "503":
          description: Database unavailable
      summary: Claim an identifier
      description: "Add an identifier code to your personal Credits Graph (`GET
        /v1/me/graph`). No API key — identify with your compute `session_id`
        (body, query, or `x-compute-session` header). The code must exist in the
        Credits index; up to 24 claims per session. Idempotent: re-claiming
        answers `200` with the stored claim. Claiming is open — `verification`
        (`unverified` | `compute_verified` | `owner_verified`) is a separate
        trust signal derived from your earned Credits Compute tier, never a
        gate."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - code
              properties:
                session_id:
                  type: string
                  format: uuid
                  description: Compute session (also accepted via ?session_id= or
                    x-compute-session header)
                type:
                  type: string
                  enum:
                    - isrc
                    - iswc
                    - ipi
                    - isni
                    - upc
                    - musician
                code:
                  type: string
                  description: "Identifier code (musician: MusicBrainz MBID)"
  /v1/me/claims/{code}:
    delete:
      tags:
        - Account & Claims
      parameters:
        - in: path
          name: code
          required: true
          schema:
            type: string
        - in: query
          name: type
          required: false
          schema:
            type: string
            enum:
              - isrc
              - iswc
              - ipi
              - isni
              - upc
              - musician
        - in: query
          name: session_id
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Removed (removed: n; 0 when nothing matched)"
        "400":
          description: Invalid session, type, or code
        "429":
          description: Rate limit exceeded
        "503":
          description: Database unavailable
      summary: Remove a claim
      description: "Remove an identifier from your personal graph. Pass `?type=` to
        disambiguate; without it the code is removed under every claim type
        whose normalization matches. Idempotent — `removed: 0` still answers
        `200`."
  /v1/me/graph:
    get:
      tags:
        - Account & Claims
      parameters:
        - in: query
          name: session_id
          required: false
          schema:
            type: string
            format: uuid
          description: Compute session (or x-compute-session header)
        - in: query
          name: depth
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 2
          description: Hops beyond your claimed codes (default 1)
      responses:
        "200":
          description: "Personal graph: root, claims (with gaps), nodes[], connections[],
            stats"
        "400":
          description: Missing or invalid session_id
        "429":
          description: Rate limit exceeded
        "503":
          description: Database unavailable
      summary: Your personal Credits Graph
      description: "The subgraph around YOUR claimed identifiers (see `POST
        /v1/me/claims`): one seeded traversal across every claim, a synthetic
        `you` root node at hop 0 with `kind: claim` connections to your codes,
        and a per-claim `gaps` summary — `verified`, `single_source`,
        `verifiable` (fixable right now via Credits Compute), and `no_match`
        (verified absences). Zero claims still answers `200` with just the `you`
        node and a hint. `depth` 1–2 (default 1). The connection array is
        `connections`; `edges` is a deprecated alias."
  /v1/mlc/{code}/related-works:
    get:
      tags:
        - Compositions
      parameters:
        - in: path
          name: code
