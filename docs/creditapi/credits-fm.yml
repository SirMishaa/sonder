      summary: Graph search (bucketed)
      description: "Music Identity search: bucketed results by entity type (`all`,
        `artist`, `song`, `recording`, `release`, `musician`, `publisher`).
        Default `limit` 20 (max 500; `-1` requests up to 500 per bucket). Use
        `offset` for paging within each bucket. Optional `exclude_lyrics=true`
        omits lyrics-indexed ISRC matches (same as GET /v1/search). Optional
        `nocache` / `no_cache` / `fresh` for uncached reads."
