  /v1/crowd/task:
    get:
      tags:
        - Crowd verification
      parameters: []
      responses:
        "400":
          description: Invalid target or missing id
        "429":
          description: Rate limit exceeded (shared per-IP budget with `POST /v1/crowd/vote`)
        "503":
          description: Database unavailable
      summary: Get a crowd verification task
      description: 'Step 1 of 2. Returns one anonymous field-choice task for a record.
        No API key; persist a client-generated `session_id` UUID so completed
        tasks are not re-served and the session can establish trust. Render the
        returned `field` and `options`, then submit one exact `option.value` (or
        `{ "not_sure": true }`) to `POST /v1/crowd/vote`. Hidden controls are
        intentionally indistinguishable from real disagreements. Returns `{
        task: null }` when nothing is available. Full workflow:
        `docs/VERIFY_AND_CONTRIBUTE.md`.'
  /v1/crowd/vote:
    post:
      tags:
        - Crowd verification
      parameters: []
      responses:
        "400":
          description: Invalid body, unknown task, choice not offered, or vote rejected
        "429":
          description: Rate limit exceeded (shared per-IP budget with `GET /v1/crowd/task`)
        "503":
          description: Database unavailable
      summary: Vote on a crowd verification task
      description: 'Step 2 of 2. Submit an exact option `value` from `GET
        /v1/crowd/task`, or `{ "not_sure": true }`, with the same `session_id`.
        No API key. `recorded` means the vote landed but consensus is not
        complete; `verified` means trusted consensus confirmed the live value;
        `resolved` means the competing value was flagged for trusted review.
        Anonymous votes never overwrite canonical data. Consensus requires 3
        distinct voters, trusted weight ≥2, and winning margin ≥1.'
