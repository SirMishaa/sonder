  /v1/graph/{type}/{id}:
    get:
      tags:
        - Music Identity
      parameters:
        - in: path
          name: type
          required: true
          schema:
            type: string
            enum:
              - isrc
              - iswc
              - ipi
              - isni
              - upc
              - musician
          description: "Root type. `musician` roots take a MusicBrainz MBID as the LOOKUP
            key and are seeded from the artist's recordings + IPIs/ISNIs
            (effective depth 1 from the seeds). Responses speak Credits IDs:
            musician node `id` is the deterministic Credits ID, with `mbid`
            carried as source provenance."
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Root identifier code (or MBID for musician)
        - in: query
          name: depth
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 2
          description: Hops from the root (default 2; fixed for musician roots)
        - in: query
          name: people
          required: false
          schema:
            type: string
            enum:
              - "0"
              - "1"
          description: Include musician (people) nodes via the MusicBrainz credit overlay
            (default 1)
        - in: query
          name: per_hop
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 25
          description: Logical-connection cap per (node, neighbor-type) (default 12)
        - in: query
          name: max_nodes
          required: false
          schema:
            type: integer
            minimum: 10
            maximum: 300
          description: Total node budget (default 200)
        - in: query
          name: nocache
          required: false
          schema:
            type: string
          description: "Bypass CDN cache (aliases: no_cache, fresh)"
      responses:
        "200":
          description: "Graph network: nodes[], connections[] (edges[] = deprecated
            alias), truncated, stats"
        "400":
          description: Invalid type or identifier
        "404":
          description: Unknown identifier (no index row, no connections, no checks)
        "503":
          description: Database unavailable
      summary: Credits Graph network
      description: "The Credits Graph: identifier nodes (`isrc`, `iswc`, `ipi`,
        `isni`, `upc`) and connections around one root code, with per-connection
        source provenance and verification status (`verified` = ≥2 independent
        sources, `single` = one). Node `no_match` lists directions checked with
        no counterpart (verified absence). Typed ISRC↔ISRC relationship
        connections (cover, sample, remix, …) are overlaid as `kind: relation`.
        `depth` 1–2 (default 2); explore third-order by re-querying any node at
        depth 1 and merging. Caps: `per_hop` ≤25 per (node, neighbor-type),
        `max_nodes` ≤300; `truncated` and per-node `has_more` report capping.
        The connection array is `connections` and counts are
        `stats.connection_count` / `stats.verified_connections`; `edges` /
        `edge_count` / `verified_edges` are deprecated aliases (same data) kept
        for one migration window."
  /v1/graph/{type}/{id}/neighbors:
    get:
      tags:
        - Music Identity
      parameters:
        - in: path
          name: type
          required: true
          schema:
            type: string
            enum:
              - isrc
              - iswc
              - ipi
              - isni
              - upc
          description: Node type (musician nodes have no crosslink neighbors)
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Node identifier code
        - in: query
          name: type
          required: true
          schema:
            type: string
            enum:
              - isrc
              - iswc
              - ipi
              - isni
              - upc
          description: Neighbor type to page through
        - in: query
          name: offset
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 5000
          description: Neighbours to skip (default 0). Prefer the `next_offset` from the
            previous page.
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 25
          description: Neighbors per page (default 12)
        - in: query
          name: nocache
          required: false
          schema:
            type: string
          description: "Bypass CDN cache (aliases: no_cache, fresh)"
      responses:
        "200":
          description: "One page of neighbours: node, neighbor_type, neighbours[], offset,
            next_offset, total, has_more"
        "400":
          description: Invalid node type, identifier, or neighbor type
        "404":
          description: Unknown identifier (no connections, no index row)
        "503":
          description: Database unavailable
      summary: Credits Graph node neighbors (paginated)
      description: "Page through the neighbors of one graph node for a single neighbor
        type. The network read (`GET /v1/graph/{type}/{id}`) caps logical
        connections per (node, neighbor-type) at `per_hop` and reports
        truncation via each node's `has_more`; this endpoint is the follow-up
        read — deterministic pages ordered by source count then recency, so no
        neighbor repeats across THIS endpoint's pages. Ordering is not
        guaranteed to align with the slice embedded in a network response (that
        read merges directions after its per-hop cut), so page from `offset=0`
        and merge results by neighbor id. Pages tile exactly: follow
        `next_offset` until `has_more` is false and you will see every neighbour
        the bounded scan found, once each. Each neighbor carries the
        connection's source provenance and verification status (`verified` = ≥2
        independent sources, `single` = one)."
  /v1/graph/activity:
    get:
      tags:
        - Music Identity
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 150
          description: Max events (default 60)
        - in: query
          name: since
          required: false
          schema:
            type: string
            format: date-time
          description: Only events after this ISO timestamp (clamped to now−24h)
        - in: query
          name: nocache
          required: false
          schema:
            type: string
          description: "Bypass CDN cache (aliases: no_cache, fresh)"
      responses:
        "200":
          description: events[], stats, as_of
        "400":
          description: Invalid since timestamp
        "503":
          description: Database unavailable
      summary: Credits Graph activity feed
      description: "Status updates across the Credits Graph, newest first:
        `link_found` (connection observed), `link_verified` (connection crossed
        ≥2 independent sources), `relation_found` (typed ISRC↔ISRC relationship:
        cover, sample, remix, …), `no_match_recorded` (direction checked against
        every source, no counterpart — verified absence). Poll with `since` set
        to the previous response's `as_of` for deltas. `since` is clamped to the
        last 24 hours. Stats include the planner-estimated Credits Graph total
        and the latest daily completeness snapshot."
  /v1/graph/expand:
    post:
      tags:
        - Music Identity
      parameters: []
      responses:
        "200":
          description: "Union of the expansions: expanded[], nodes[], connections[],
            truncated, stats"
        "400":
          description: Invalid body, node type, or identifier
        "404":
          description: No requested node resolved to a valid identifier
        "503":
          description: Database unavailable
      summary: Credits Graph batch expansion
      description: "Expand several graph nodes in ONE call — the explorer's follow-up
        read when a user opens multiple nodes. Runs a single seeded traversal
        across every requested node and returns the union, with per-connection
        provenance and verification status exactly as `GET
        /v1/graph/{type}/{id}` does. Pass `exclude` (node keys you already hold,
        `\"type:id\"`) to strip nodes from the response; connections touching
        them are still returned, since the connection is the new information.
        Seeds are always excluded. Caps: 48 nodes per request, `per_hop` ≤25,
        `max_nodes` ≤300; free/unentitled callers are capped at 25 nodes and the
        preview envelope."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nodes
              properties:
                nodes:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - id
                    properties:
                      type:
                        type: string
                        enum:
                          - isrc
                          - iswc
                          - ipi
                          - isni
                          - upc
                      id:
                        type: string
                exclude:
                  type: array
                  items:
                    type: string
                  description: Node keys already held ("isrc:USRC17607839")
                depth:
                  type: integer
                  minimum: 1
                  maximum: 2
                  description: Hops from each seed (default 1)
                per_hop:
                  type: integer
                  minimum: 1
                  maximum: 25
                  description: Connection cap per (node, neighbor-type) (default 12)
                max_nodes:
                  type: integer
                  minimum: 10
                  maximum: 300
                  description: Total node budget (default 200)
                people:
                  type: boolean
                  description: Include musician (people) nodes (default true)
  /v1/graph/search:
