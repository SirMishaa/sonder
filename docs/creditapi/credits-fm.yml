          schema:
            type: string
            enum:
              - eligible
              - ineligible
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - in: query
          name: offset
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Eligibility verdicts per ISRC
        "400":
          description: Invalid parameters
        "404":
          description: Musician not found
        "503":
          description: Database unavailable
      summary: Registration eligibility for a musician (MBID)
      description: Per-song verdict (eligible | ineligible) aggregated across every
        IPI linked to the MBID via mb_artist_ipis. Gated on the
        verified_publishers table.
  /v1/ownership/analyze-data:
    post:
      tags:
        - Ownership
      parameters: []
      responses:
        "200":
          description: OK
      summary: Songwriter analysis on caller-supplied matched_songs (no fetch)
  /v1/ownership/analyze:
    post:
      tags:
        - Ownership
      parameters: []
      responses:
        "200":
          description: OK
      summary: Songwriter analysis across ISRCs
      description: "Live MLC analysis: every songwriter across the ISRCs with
        per-songwriter song_count, walking interested_parties. Sourced from the
        Notes Credits API (batched). For catalog songwriter aggregation
        (notes-api collaborators, fast index reads), use POST /v1/songwriters
        instead — do not call this route for that job."
  /v1/ownership/ip-chains-data:
    post:
      tags:
        - Ownership
      parameters: []
      responses:
        "200":
          description: OK
      summary: Broken IP-chain detection on caller-supplied matched_songs (no fetch)
  /v1/ownership/ip-chains:
    post:
      tags:
        - Ownership
      parameters: []
      responses:
        "200":
          description: OK
      summary: Broken IP-chain detection for a writer across ISRCs
  /v1/ownership/representation-data:
    post:
      tags:
        - Ownership
      parameters: []
      responses:
        "200":
          description: OK
      summary: Representation verdict on caller-supplied matched_songs (no fetch)
  /v1/ownership/representation:
    post:
      tags:
        - Ownership
      parameters: []
      responses:
        "200":
          description: OK
      summary: Songwriter representation check across ISRCs
  /v1/ownership/search-data:
    post:
      tags:
        - Ownership
      parameters: []
      responses:
        "200":
          description: OK
      summary: Songwriter name search on caller-supplied matched_songs (no fetch)
  /v1/ownership/search:
    post:
      tags:
        - Ownership
      parameters: []
      responses:
        "200":
          description: OK
      summary: Songwriter name search with representation analysis
      description: "Live MLC analysis: writers matching name, hierarchically-connected
        trusted publishers, and per-song representation flags. Sourced from the
        Notes Credits API (batched). For publishers nested under a writer across
        a catalog (notes-api musician merge), use POST /v1/publishers with
        writer_name instead — do not call this route for that job."
  /v1/publishers:
    post:
      tags:
        - Catalog
      parameters: []
      responses:
        "200":
          description: Aggregated publishers for the writer
        "400":
          description: Invalid body
        "503":
          description: Database unavailable
      summary: Find publishers for a writer across recordings
      security: []
      description: Catalog publisher aggregation (notes-api musician publisher merge
        and similar). Given a writer name (fuzzy matched, typically the last
        name) and a set of ISRCs, returns the publishers credited under that
        writer across those recordings, each with an isrc_count. Reads
        isrc_index.songwriters JSONB nesting — not a live MLC trusted-publisher
        walk. Same shape as `related_entities` on GET /v1/ipi/{ipi}. Body field
        is writer_name (`name` returns 400). ISRCs are uppercased, stripped of
        separators, deduped, and capped at 1000. Do not use POST
        /v1/ownership/search for this job.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                writer_name:
                  type: string
                  description: Writer name, fuzzy matched (typically last name)
                isrcs:
                  type: array
                  items:
                    type: string
                  description: Catalog ISRCs (normalized + deduped, capped at 1000)
              required:
                - writer_name
                - isrcs
  /v1/publishers/{ipi}/catalog:
    get:
      tags:
        - Lookups
      parameters:
        - in: path
          name: ipi
          required: true
          schema:
            type: string
            pattern: ^\d{9,11}$
            example: "01138884620"
        - in: query
          name: role
          required: false
          schema:
            type: string
            enum:
              - RightsAdministrator
              - OriginalPublisher
              - SubPublisher
              - SubstitutedPublisher
        - in: query
          name: include
          required: false
          schema:
            type: string
            enum:
              - issues
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - in: query
          name: offset
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Publisher catalog
        "400":
          description: Invalid parameters
        "404":
          description: No catalog found for this IPI / role
        "503":
          description: Database unavailable
      summary: Get publisher catalog with optional audit flags
      description: Returns every ISRC where the given publisher IPI is credited
        (optionally filtered by role). Pass include=issues to get per-song
        data-quality flags (missing_iswc, missing_mlc_code, missing_sw_ipi) and
        summary counts.
  /v1/publishers/{ipi}/musicians:
    get:
      tags:
        - Lookups
      parameters:
        - in: path
          name: ipi
          required: true
          schema:
            type: string
            pattern: ^\d{9,11}$
            example: "01138884620"
        - in: query
          name: role
          required: false
          schema:
            type: string
            enum:
              - RightsAdministrator
              - OriginalPublisher
              - SubPublisher
              - SubstitutedPublisher
              - all
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
        - in: query
          name: offset
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Musicians for the publisher
        "400":
          description: Invalid parameters
        "404":
          description: Publisher has no matching songs
        "503":
          description: Database unavailable
      summary: Musicians administered by a publisher
      description: "Reverse lookup: given a publisher IPI, returns the ranked list of
        songwriters/musicians they work with, with per-musician song counts.
        Default role filter is RightsAdministrator (the most BI-relevant slice).
        Use role=all for no filter. MBIDs resolved via mb_artist_ipis when
        available."
  /v1/publishers/search:
    get:
      tags:
        - Lookups
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
            minLength: 2
        - in: query
          name: role
          required: false
          schema:
            type: string
            enum:
              - RightsAdministrator
              - OriginalPublisher
              - SubPublisher
              - SubstitutedPublisher
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: offset
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Publisher search results
        "400":
          description: Invalid query parameters
        "503":
          description: Database unavailable
      summary: Search publishers by name
      description: Returns publisher entities matching a name fragment, aggregated
        from ipi_isrc_mappings. Each item carries role counts
        (RightsAdministrator, OriginalPublisher, SubPublisher,
        SubstitutedPublisher) and distinct song count across any role.
        Optionally filter by a single publisher role.
  /v1/related-works/{id}:
    get:
      tags:
        - Compositions
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            example: ISWC:T9287606864
          description: Deterministic group ID. Either `ISWC:<min iswc>` or `MLC:<min
            mlc_song_code>`.
      responses:
        "200":
          description: Related-works group with full member list.
        "400":
          description: Invalid group ID format.
        "404":
          description: Related-works group not found.
        "503":
          description: Database unavailable.
      summary: Get related-works group by ID
      description: Returns the full related-works group — head + every member ISWC and
        MLC Song Code. Groups group identifiers that represent the same
        underlying musical work. Built nightly from MLC Song Code collisions,
        CISAC redirects, MusicBrainz works, and title/writer similarity.
  /v1/resolve/batch:
    post:
      tags:
        - Resolve
      parameters: []
      responses:
        "200":
          description: Batch results
        "400":
          description: Invalid body
        "503":
          description: Database unavailable
      summary: Batch resolve tracks to ISRCs
      description: Up to 50 { name, artist } pairs. Returns total, resolved count, and
        per-row credits_url when ISRC found.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tracks:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      artist:
                        type: string
  /v1/resolve/songwriter:
    post:
      tags:
        - Resolve
      parameters: []
      responses:
        "200":
          description: Resolved songwriter (single match with publishers, or
            disambiguation list)
        "400":
          description: Invalid body
        "503":
          description: Database unavailable
      summary: Resolve songwriter name to IPI
      description: Given a songwriter name and ISRCs/ISWCs for context, searches
        isrc_index.songwriters to find matching IPIs. If exactly one IPI
        matches, returns publisher data inline. If multiple match, returns a
        disambiguation list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Songwriter name (fuzzy matched)
                isrcs:
                  type: array
                  items:
                    type: string
                  description: ISRCs of songs they're credited on (max 500)
                iswcs:
                  type: array
                  items:
                    type: string
                  description: ISWCs of works they're credited on (max 100)
              required:
                - name
  /v1/resolve/track:
    post:
      tags:
        - Resolve
      parameters: []
      responses:
        "400":
          description: Missing required body fields
        "500":
          description: Unexpected server error
        "503":
          description: Database unavailable
        "504":
          description: Resolve exceeded time budget (try again)
      summary: Resolve single track to ISRC and credits
      description: "Resolve by name+artist, DSP URL, or a Spotify/Apple Music DSP
        resource id. When name/artist accompanies a DSP identity, verifies the
        exact recording and returns `recording_match: false` instead of
        attaching the wrong recording's ISRC. Otherwise returns ISRC and credits
        when found, or 200 with `isrc: null`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                artist:
                  type: string
                spotify_url:
                  type: string
                  format: uri
                apple_music_url:
                  type: string
                  format: uri
                dsp:
                  type: string
                  enum:
                    - spotify
                    - apple_music
                  description: Required only for a bare DSP ID
                dsp_resource_id:
                  type: string
                  description: Raw BWARM identifier (`spotify::spotify:track:…`, `applemusic::…`)
                    or a bare track/song ID with `dsp`
                unmatched_resource_record_id:
                  type: string
                  description: BWARM UnmatchedResourceRecordId; echoed with a stable per-resource
                    key
                contribute:
                  type: boolean
                  description: Include missing_fields + contribute_url when gaps exist (default
                    true). Set false to opt out.
  /v1/samples:
    get:
      tags:
        - Discovery
      parameters: []
      responses:
        "200":
          description: Arrays of sample identifiers per type
        "503":
          description: Database unavailable
      summary: Sample identifiers
      description: "Returns up to ten IDs per type: curated working examples first,
        then richer index rows (isrcs, iswcs, ipis, isnis, upcs, mbids) for
        building detail URLs."
  /v1/search:
    get:
      tags:
        - Search
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
            minLength: 1
          description: Search text or identifier (canonicalized server-side)
        - in: query
          name: type
          required: false
          schema:
            type: string
            enum:
              - auto
              - isrc
              - iswc
              - ipi
              - isni
              - upc
              - musician
              - all
            default: auto
          description: Which buckets to search (default auto)
        - in: query
          name: match
          required: false
          schema:
            type: string
            enum:
              - default
              - recording_title
            default: default
          description: "`recording_title`: title/song columns only for ISRC bucket (no
            artist-name catalog path); with type auto/all, other buckets are
            skipped unless the query looks like a specific code."
        - in: query
          name: exclude_lyrics
          required: false
          schema:
            type: string
            enum:
              - "true"
              - "false"
              - "1"
              - "0"
          description: When true, ISRC hits skip lyrics-indexed / broad text paths
            (title-focused ranking).
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 0
        - in: query
          name: offset
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: engine
          required: false
          schema:
            type: string
            enum:
              - pg
              - typesense
          description: Search engine for fuzzy text queries. Default follows
            `NITRO_USE_TYPESENSE`. `typesense` forces Typesense for this request
            when server permits override; `pg` forces PostgreSQL. Engine applies
            to every text-search `type` (`auto`, `all`, `isrc`, `iswc`, `ipi`,
            `isni`, `upc`); the `musician` bucket and exact identifier
            (ISRC/ISWC/IPI/ISNI/UPC) lookups always use PG. When Typesense
            answers a bucket, the per-bucket PG branch is skipped to avoid the
            12s tsquery ceiling.
        - in: query
          name: entity_type
          required: false
          schema:
            type: string
          description: Comma-separated list. Filters IPI / ISNI buckets by `entity_type`
            (e.g. `musician,publisher`). Typesense path only.
        - in: query
          name: roles
          required: false
          schema:
            type: string
          description: Comma-separated list. Filters IPI / ISNI buckets by `roles`
            (any-of). Typesense path only.
        - in: query
          name: release_year_min
          required: false
          schema:
            type: integer
            minimum: 0
          description: Lower bound on `release_year` for ISRC + UPC buckets. Typesense
            path only.
        - in: query
          name: release_year_max
          required: false
          schema:
            type: integer
            minimum: 0
          description: Upper bound on `release_year` for ISRC + UPC buckets. Typesense
            path only.
        - in: query
          name: min_isrc_count
          required: false
          schema:
            type: integer
            minimum: 0
          description: Minimum `isrc_count` for ISWC / IPI / ISNI / UPC buckets. Typesense
            path only.
        - in: query
          name: source
          required: false
          schema:
            type: string
          description: Comma-separated list. Filters ISRC bucket by primary `source` (e.g.
            `mlc,musicbrainz`). Typesense path only.
        - in: query
          name: type_label
          required: false
          schema:
            type: string
          description: Comma-separated list. Filters musicians bucket by `type_label`
            (`group` | `person`). Title-cased server-side to match stored
            values; Typesense path only.
        - in: query
          name: sort_by
          required: false
          schema:
            type: string
            enum:
              - relevance
              - isrc_count
              - recent
              - title
            default: relevance
          description: Per-bucket sort applied on the Typesense path. `recent` only for
            ISRC/UPC; other buckets fall back to relevance.
        - in: query
          name: facets
          required: false
          schema:
            type: string
            enum:
              - "true"
              - "false"
              - "1"
              - "0"
          description: When truthy on the Typesense path, response carries a `meta` block
            with per-bucket facet counts + `search_time_ms` + `found` totals.
        - in: query
          name: nocache
          required: false
          schema:
            type: string
          description: "Skip public CDN cache (aliases: no_cache, fresh)"
      responses:
        "200":
          description: Bucketed hits; optional linkResult, warnings
        "400":
          description: Invalid query (bad type, limit, offset window, …)
        "503":
          description: Database unavailable
      summary: Unified identifier search
  /v1/songwriters:
    post:
      tags:
        - Catalog
      parameters: []
      responses:
        "200":
          description: Aggregated songwriters
        "400":
          description: Invalid body
        "503":
          description: Database unavailable
      summary: Aggregate songwriters across recordings
      security: []
      description: Catalog songwriter aggregation (notes-api collaborators and
        similar). Given a set of ISRCs, returns the distinct songwriters
        credited across them, each with a song_count (distinct ISRCs the writer
        appears on within the input). Reads isrc_index.songwriters JSONB — not a
        live MLC fetch. ISRCs are uppercased, stripped of separators, deduped,
        and capped at 1000. Publishers are not nested — use POST /v1/publishers.
        Do not use POST /v1/ownership/analyze for this job.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isrcs:
                  type: array
                  items:
                    type: string
                  description: Catalog ISRCs (normalized + deduped, capped at 1000)
              required:
                - isrcs
  /v1/suggest:
    get:
      tags:
        - Search
      parameters:
        - in: query
          name: q
          required: false
          schema:
            type: string
            minLength: 2
          description: Search string (min 2 chars)
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 25
          description: Max suggestions (default 10); 0 = bounded window fill
        - in: query
          name: offset
          required: false
          schema:
            type: integer
            minimum: 0
          description: Skip N suggestions; offset + limit ≤ 100 (default 0)
        - in: query
          name: nocache
          required: false
          schema:
            type: string
          description: Skip CDN cache (1/true/yes); aliases no_cache, fresh
      responses:
        "200":
          description: Suggestions array (empty when q too short or DB unavailable)
      summary: Autocomplete suggestions
      description: Fast autocomplete across ISRC, ISWC, IPI, ISNI, UPC and musicians.
        Min 2 characters. limit default 10; limit 0 fills bounded window.
  /v1/typeahead:
    get:
      tags:
        - Search
      parameters:
        - in: query
          name: q
          required: false
          schema:
            type: string
            minLength: 2
          description: Search string (min 2 chars after trim)
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 25
            default: 10
          description: Max suggestions returned after interleaving (default 10)
        - in: query
          name: nocache
          required: false
          schema:
            type: string
          description: Skip CDN cache (1/true/yes); aliases no_cache, fresh
      responses:
        "200":
          description: Suggestions array (empty when q too short or DB unavailable)
      summary: Cross-collection typeahead (Typesense-backed)
      description: Prefix + typo-tolerant autocomplete across recordings, songs,
        releases, publishers/writers, and artists. Response shape matches
        /v1/suggest so the frontend dropdown can route both endpoints through
        the same parser. Falls back to PG `/v1/suggest` when Typesense isn't
        configured.
  /v1/upc/{upc}:
    get:
      tags:
        - Lookups
      parameters:
        - in: path
          name: upc
          required: true
          schema:
            type: string
            pattern: ^\d{12,14}$
            example: "602445790098"
          description: 12–14 digit UPC / EAN (**digits only** in the path). No
            contribution hints on flat release rows.
      responses:
        "200":
          description: Flat **`upc_index`** row (snake_case) or Music Identity release
            graph when graph query keys are used.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Invalid or missing UPC
        "404":
          description: UPC not found
        "503":
          description: Database unavailable
      summary: Get UPC
      description: "**Canonical UPC URL.** Default: release summary from `upc_index`.
        With **`graph=1`** or graph query keys: Music Identity graph (same as
        legacy **`GET /v1/releases/{upc}`**)."
  /v1/validate/batch:
    options:
      tags:
        - App Routes
      parameters: []
      responses:
        "200":
          description: OK
    post:
      tags:
        - Validate
      parameters: []
      responses:
        "200":
          description: OK
      summary: Batch ISRC validation
      description: Validate ISRCs against index + Notes Credits API. Optional
        include_dsp_check cross-references Spotify and Apple Music when
        credentials are configured. ?format=csv returns CSV.
  /v1/verify/{type}/{code}:
    get:
      tags:
        - Verify
      parameters:
        - in: path
          name: type
          required: true
          schema:
            type: string
            enum:
              - isrc
              - iswc
              - ipi
              - isni
              - upc
            example: isrc
        - in: path
          name: code
          required: true
          schema:
            type: string
            example: GBAYE0601498
        - in: query
          name: raw
          required: false
          schema:
            type: string
            enum:
              - "1"
          description: Include raw per-adapter results
      responses:
        "200":
          description: Verify result
        "400":
          description: Invalid type or code format
      summary: Multi-source identifier verification
      description: "Use this to inspect evidence, not to submit a new value. Fans out
        to every configured source supporting the identifier type and returns
        per-field `{ value, verified, agreeing_sources, disagreeing_sources }`,
        `overall_level` (`unverified`, `single_source`, `verified`, or
        `conflicted`), and `linked_identifiers` with edge provenance. A field is
        verified when ≥2 independent sources agree. Unavailable adapters do not
        count as negative evidence. The request records the verification attempt
        and observed conflicts. Use `POST /v1/contribute` when your integration
        already has sourced data. Full workflow:
        `docs/VERIFY_AND_CONTRIBUTE.md`."
  /v1/verify/batch:
    post:
      tags:
        - Verify
      parameters: []
      responses:
        "200":
          description: OK
      summary: Batch multi-source verification
      description: Run the same evidence inspection as `GET /v1/verify/:type/:code`
        for up to 100 `{ type, code }` items. This does not submit
        caller-supplied values. Invalid entries are returned inline as `{ error,
        input }`, preserving input order. Use `POST /v1/contribute` when your
        integration already has sourced metadata or a link.
  /docs:
    get:
      tags:
        - App Routes
      parameters: []
      responses:
        "200":
          description: OK
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: Credits.fm API key (`cfm_` prefix). Issue via POST /v1/keys or on
        credits.fm.
tags:
  - name: Discovery
    description: Service JSON (`GET /`), samples, MCP doc redirect.
  - name: Health
    description: Liveness (`/healthz`, `/v1/health`) and public coverage metrics.
  - name: Search
    description: Unified search and autocomplete (`/v1/search`, `/v1/suggest`).
  - name: Lookup
    description: Platform URL resolution (`/v1/lookup`).
  - name: Lookups
    description: Identifier detail routes (ISRC, ISWC, IPI, ISNI, UPC) and related
      sub-resources.
  - name: Music Identity
    description: Graph discovery (`GET /v1/identity`) and bucketed search (`GET
      /v1/graph/search`).
  - name: Batch
    description: Batch identifier fetch (`POST /v1/batch`).
  - name: Resolve
    description: Track/songwriter resolution helpers.
  - name: Validate
    description: ISRC validation against registry data.
  - name: Verify
    description: Multi-source identifier verification.
  - name: Audit
    description: Share and unmatched audits (JSON/CSV).
  - name: Contributions
    description: Authenticated data contributions (`POST /v1/contribute`).
  - name: Crowd verification
    description: "Anonymous one-tap field verification (`GET /v1/crowd/task`, `POST
      /v1/crowd/vote`). No API key — identify with a client-generated
      `session_id` UUID. Hidden credit controls gate trust; consensus never
      overwrites a canonical scalar. Guide: `docs/VERIFY_AND_CONTRIBUTE.md`."
  - name: Credits Compute
    description: "Anonymous candidate-matching work units (`GET /v1/compute/unit`,
      `POST /v1/compute/result`) that earn higher rate limits and graph
      entitlement. No API key — same `session_id` UUID as crowd. Status: `GET
      /v1/me`. Guide: `docs/VERIFY_AND_CONTRIBUTE.md`."
  - name: Account & Claims
    description: "Your personal Credits Graph: claim identifiers against your
      anonymous compute session (`POST /v1/me/claims`), read the claimed
      subgraph with gap summaries (`GET /v1/me/graph`), and optionally persist
      claims across devices with a passwordless email account (`/v1/account/*` —
      availability reported by `account_sign_in` on `GET /v1/me`)."
  - name: API keys
    description: Issue API keys (`POST /v1/keys`).
  - name: MCP
    description: Model Context Protocol over Streamable HTTP (`/v1/mcp` —
      unversioned `/mcp` aliases here).
  - name: Cover art
    description: Deprecated compatibility endpoint; artwork is excluded from public
      API responses.
  - name: Enrich
    description: Keyed public-registry completion for ISRC, ISWC, IPI, ISNI, and
      UPC. Every run performs the same bounded neighborhood walk and contributes
      fill-only facts. Free for every valid Credits API key.
  - name: App Routes
    description: Nitro default bucket for untagged routes — should be empty; report
      stray operations if you see this group.
