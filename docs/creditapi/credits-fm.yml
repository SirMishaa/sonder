      responses:
        "200":
          description: Related-works group including this MLC Song Code.
        "400":
          description: Invalid MLC Song Code.
        "404":
          description: MLC Song Code not found in any group.
        "503":
          description: Database unavailable.
      summary: Get related-works group for MLC Song Code
      description: Returns the related-works group containing this MLC Song Code. A
        group groups MLC Song Codes and ISWCs that represent the same musical
        work. 404 when the code is not part of any group (i.e. no detected
        duplicate registrations).
