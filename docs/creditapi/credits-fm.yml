openapi: 3.1.0
info:
  title: Credits API
  version: 1.2.2
  description: >-
    Music Credits + Identifier Search. **Interactive docs (Scalar):** `/docs`.
    **OpenAPI JSON:** `/_openapi.json`.


    ## Servers and paths


    - **API:** `/v1/*` — **snake_case** JSON. Scalar lists these operations
    under **Canonical API (v1)**.

    - **This specification** (as served at `/_openapi.json` and `/docs`)
    documents the **`/v1/*`** surface plus discovery, redirects, and shared
    infrastructure — not alternate version prefixes.

    - **Production API host** (`https://api.credits.fm`): use paths as in this
    document (e.g. `GET /v1/search`). Do **not** call
    `https://api.credits.fm/api/search` for Try-it — unversioned `/api/*` here
    **308** to `/v1/*` (see **Redirects** tag).

    - **credits.fm (Next.js)** exposes camelCase JSON under
    `https://credits.fm/api/*`. Conceptually map `GET /v1/search` ↔ `GET
    https://credits.fm/api/search` by swapping the prefix; casing follows each
    host (see discovery `GET /`).


    ## Contribute by default


    Contributing is **opt-out**, not opt-in. Lookup responses are designed to
    highlight data gaps so clients can submit improvements.


    - **GET** `/v1/isrc/{isrc}`, `/v1/iswc/{iswc}`, `/v1/ipi/{ipi}`,
    `/v1/isni/{isni}`: unless you pass **`?contribute=false`**, successful
    responses may include **`missing_fields`** (array) and **`contribute_url`**
    when gaps exist.

    - **POST** `/v1/batch`: include **`"contribute": false`** in the JSON body
    to omit **`contribute_url`** in the response. Default is to include it.

    - **POST** `/v1/resolve/track`: include **`"contribute": false`** in the
    body to omit **`missing_fields`** / **`contribute_url`** on success. Default
    is on.

    - **MCP** (`/v1/mcp` and unversioned `/mcp`): lookup tools accept
    **`contribute: false`** in tool arguments to opt out of contribution nudges;
    the server instructions describe the default behavior.


    Actual writes use **POST /v1/contribute** with a valid **`x-api-key`** (see
    the Contributions tag). A dedicated public UI for this API may ship later;
    for now, **Scalar** documents behavior here.


    ## Enrich


    **POST `/v1/enrich/{type}`** completes one ISRC, ISWC, IPI, ISNI, or UPC
    from public registries and follows a bounded set of proven connections. It
    is asynchronous: poll the returned **`/v1/jobs/{job_id}`** URL. Enrich is
    free for every valid Credits API key; usage is recorded at
    **`billable=false`** and unit price zero.


    ## Music Identity graph detail — pagination & expansion


    Single-resource **graph** responses are served from **identifier paths** —
    **`/v1/iswc/{iswc}`**, **`/v1/isrc/{isrc}`**, **`/v1/upc/{upc}`**,
    **`/v1/isni/{isni}`**, **`/v1/ipi/{ipi}`** — with the same query parameters.
    Older bookmarked human-readable URL segments may still **308** to these
    paths in production; this specification lists the canonical routes only.
    **Identifier** routes accept:


    - **`include`**, **`relationships`**, **`relationship`** — merged;
    comma-separated relationship keys; **`include=all`** expands every edge the
    handler supports.

    - **`depth`** — 1–5 (default 1); controls how far nested objects expand
    (e.g. plain ISRC codes vs `{ isrc, title, … }`). On **UPC graph**
    (**`/v1/upc/{upc}`**) with **`include=songs`**, **`depth=2`** adds each
    work’s recordings, writers, and publishers under that song.

    - **`limit`** / **`offset`** — paginate **relationship arrays** only
    (default **50** / **0**); **`limit=-1`** returns full lists. Each expanded
    list includes a matching **`total_*`** field (e.g. **`total_recordings`**)
    for client-side paging.


    See **`docs/MUSIC_IDENTITY_API.md`** and **`docs/PAGINATION.md`** for
    aliases and edge cases.


    ## API keys (do not confuse with “wrong Supabase”)


    - **Read-heavy routes** (`GET /v1/isrc/…`, `POST /v1/batch`, `GET
    /v1/search`, …) are **public**. They do **not** validate `x-api-key`; a
    **200** from batch or a lookup **does not** prove your key is registered.

    - **Writes / key management** (`POST /v1/contribute`, `POST /v1/keys`)
    **require** a valid `cfm_…` key stored in **`api_keys`** on the **same**
    Supabase project as the index (`isrc_index`, …). If contribute returns
    **401** while batch returns **200**, treat that as **key resolution**
    (missing header, wrong prefix, revoked key, typo) — **not** as evidence of
    two different databases: **contributions** and **api_keys** use the same
    `Supabase()` client as batch lookups.

    - **Anonymous tier** cannot contribute (`contribute` rate limit `0`/min);
    you need a **free** (or internal) key for `POST /v1/contribute`.
servers:
  - url: https://api.credits.fm
    description: Production (standalone Nitro). Documented paths are under
      **`/v1/*`** (e.g. `/v1/search`, `/v1/suggest`). Do not use `/api/...` on
      this host for Try-it — unversioned `/api/*` **308**s to **`/v1/*`.
paths:
  "":
    get:
      tags:
        - App Routes
      parameters: []
      responses:
        "200":
          description: OK
  /api/{path}:
    get:
      tags: []
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
      summary: 308 redirects — /api/* → versioned routes at host root
  /healthz:
    get:
      tags:
        - Health
      parameters: []
      responses:
        "200":
          description: Liveness OK (body may indicate degraded/critical)
      summary: Liveness check (Render)
      description: Always returns 200 so load balancers succeed. Body contains status,
        database, and table health.
  /:
    get:
      tags:
        - Discovery
      parameters: []
      responses:
        "200":
          description: JSON with `service`, `version`, `transition`, `docs` (canonical
            **`v1`** templates), `links` (including `mcp_docs` → `/mcp/docs` →
            `/docs`).
      summary: API discovery
      description: "Returns service metadata and **`/v1/*`** URL templates for health,
        search, lookups, verification, contribution, Crowd, Compute, MCP, and
        Music Identity. Interactive reference: **GET /docs**. Developer workflow
        guide: **docs/VERIFY_AND_CONTRIBUTE.md**."
  /mcp:
    delete:
      tags:
        - MCP
      parameters: []
      responses:
        "200":
          description: OK
      summary: DELETE /mcp — session teardown (alias of /v1/mcp)
    get:
      tags:
        - MCP
      parameters: []
      responses:
        "200":
          description: OK
      summary: GET /mcp — unversioned alias of /v1/mcp
      description: Re-exports **`GET /v1/mcp`**. Prefer **`/v1/mcp`** in documentation
        and new clients.
    options:
      tags:
        - MCP
      parameters: []
      responses:
        "200":
          description: OK
      summary: OPTIONS /mcp — CORS preflight (alias of /v1/mcp)
    post:
      tags:
        - MCP
      parameters: []
      responses:
        "200":
          description: OK
      summary: POST /mcp — unversioned alias of /v1/mcp
      description: Re-exports **`POST /v1/mcp`**. Prefer **`/v1/mcp`** for new integrations.
  /mcp/docs:
    get:
      tags:
        - Discovery
      parameters: []
      responses:
        "200":
          description: OK
      summary: GET /mcp/docs — redirect to Scalar /docs
      description: "**302** to **`/docs`** (Scalar UI)."
  /v1/account/magic-link:
    post:
      tags:
        - Account & Claims
      parameters: []
      responses:
        "200":
          description: Link sent (identical response whether or not the account existed)
        "400":
          description: Invalid email
        "429":
          description: Rate limit exceeded (per IP and per email)
        "503":
          description: Email sign-in not configured on this deployment, or database
            unavailable
      summary: Request a sign-in link
      description: "Send a passwordless magic sign-in link to an email address.
        Accounts are optional: they exist to persist your claimed identifiers
        across devices by ADOPTING your anonymous compute session — claims
        themselves always live on sessions. The link is single-use and expires
        in 15 minutes; requesting a new link invalidates the previous one.
        Answers `503` on deployments where email sign-in isn't configured (see
        `account_sign_in` on `GET /v1/me`)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                session_id:
                  type: string
                  format: uuid
                  description: Session to adopt on verify (defaults to the one that requests the
                    link)
  /v1/account/me:
    get:
      tags:
        - Account & Claims
      parameters: []
      responses:
        "200":
          description: Account, sessions, tier, and claims
        "401":
          description: Missing, invalid, or expired account token
        "503":
          description: Email sign-in not configured, or database unavailable
      summary: Your account
      description: "The signed-in account: email, adopted sessions, best earned
        Credits Compute tier across them, and the deduped union of claims from
        every adopted session. Authenticate with `Authorization: Bearer
        <account_token>` (from `POST /v1/account/verify`). Transport is
        header-only — no cookies."
  /v1/account/verify:
    post:
      tags:
        - Account & Claims
      parameters: []
      responses:
        "200":
          description: "Signed in: account_token (bearer), account, session_adopted"
        "400":
          description: Invalid body
        "401":
          description: Invalid, expired, or already-used link
        "429":
          description: Rate limit exceeded
        "503":
          description: Email sign-in not configured, or database unavailable
      summary: Verify a sign-in link
      description: "Exchange the single-use token from your magic sign-in link for a
        long-lived bearer `account_token` (90 days — send it as `Authorization:
        Bearer …` to `GET /v1/account/me`). Verifying also ADOPTS your compute
        session onto the account so its claims persist across devices; nothing
        is lost in the upgrade and claims never move between sessions. A link is
        invalid after first use, after expiry (15 min), or once a newer link was
        requested."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  description: The token from the emailed link
                session_id:
                  type: string
                  format: uuid
                  description: Session to adopt (falls back to the session that requested the
                    link)
  /v1/artist/{id}:
    get:
      tags:
        - Music Identity
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: ^[a-zA-Z0-9]{22}$
            example: 1dfeR4HaWDbWqFHLkxsg1d
          description: Spotify artist ID (22 chars) — used as the platform key; catalog
            comes from the Credits index
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
        - in: query
          name: offset
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Release offset for pagination
      responses:
        "200":
          description: Artist discography page from index (snake_case); may be sparse
            while enrichment is queued
        "400":
          description: Invalid Spotify artist ID
        "500":
          description: Internal error
        "503":
          description: Database not configured
        "504":
          description: Timed out
      summary: Get artist discography by Spotify ID
      description: Index-first discography from MusicBrainz + upc_index + isrc_index
        (Credits owns the catalog). Spotify is not awaited on the request path —
        a background harvest may enrich the index after the response. Paginated
        by release (`limit` default 5, max 10; `offset`).
  /v1/audit/catalog:
    post:
      tags:
        - Audit
      parameters: []
      responses:
        "200":
          description: OK
      summary: Publisher-catalog audit (two-file classification)
      description: "Classify a publisher catalog into recording-match issues and
        composition-registration (duplicate registration) issues. Each row
        carries the metadata that drove its classification: recording title +
        writers + IPIs from the ISRC side, plus the full related-works group
        context from the assigned MLC Song Code. Pass `?format=csv` for a
        combined-CSV response with two clearly-marked sections."
  /v1/audit/classify:
    post:
      tags:
        - Audit
      parameters: []
      responses:
        "200":
          description: OK
      summary: Classify one ISRC (audit)
      description: Single-row catalog-audit classification. Same scoring as
        /v1/audit/catalog but for one ISRC. Returns the row's recording-match
        score, composition-registration flag, and the full related-works group
        context.
  /v1/audit/shares:
    options:
      tags:
        - App Routes
      parameters: []
      responses:
        "200":
          description: OK
    post:
      tags:
        - Audit
      parameters: []
      responses:
        "200":
          description: OK
      summary: Share audit (batch) — not currently available (returns 403 while MLC
        ownership shares are withheld pending licensing)
  /v1/audit/unmatched:
    options:
      tags:
        - App Routes
      parameters: []
      responses:
        "200":
          description: OK
    post:
      tags:
        - Audit
      parameters: []
      responses:
        "200":
          description: OK
      summary: Unmatched audit (batch)
  /v1/batch:
    options:
      tags:
        - App Routes
      parameters: []
      responses:
        "200":
          description: OK
    post:
      tags:
        - Batch
      parameters: []
      responses:
        "400":
          description: Invalid body or no identifier arrays
        "503":
          description: Database unavailable
      summary: Batch lookup
      security: []
      description: >-
        Look up multiple identifiers in one request. Send JSON with one or more
        of: isrcs, iswcs, ipis, isnis, upcs (each array max 100, total across
        arrays ≤ 100). Returns maps keyed by code. Top-level `contribute_url` is
        included unless `contribute: false` in the body.


        **Auth:** this route does **not** read or validate `x-api-key`. Sending
        a key has **no effect** on authorization. A **200** here does **not**
        prove your API key is valid; use `POST /v1/contribute` (or `POST
        /v1/keys`) to verify credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isrcs:
                  type: array
                  items:
                    type: string
                  maxItems: 100
                iswcs:
                  type: array
                  items:
                    type: string
                  maxItems: 100
                ipis:
                  type: array
                  items:
                    type: string
                  maxItems: 100
                isnis:
                  type: array
                  items:
                    type: string
                  maxItems: 100
                upcs:
                  type: array
                  items:
                    type: string
                  maxItems: 100
                contribute:
                  type: boolean
                  description: Include contribute_url in response (default true). Set false to opt
                    out.
                include_mlc_works:
                  type: boolean
                  description: Augment ISRC results with live MLC Public Work Search data.
                    Cache-respecting (14-day); only stale rows hit MLC. Capped
                    at 25 ISRCs/request.
  /v1/billing/checkout:
    post:
      tags:
        - Billing
      parameters: []
      responses:
        "200":
          description: "{ url } — redirect the user here"
        "400":
          description: Invalid plan
        "401":
          description: Missing or invalid API key
        "503":
          description: Billing not configured
      summary: Start Credits Graph checkout
      description: Create a Stripe Checkout session for a paid Credits Graph plan
        (`pro` or `partner`). Authenticate with your full `x-api-key`. Returns
        the hosted Checkout URL.
  /v1/billing/portal:
    post:
      tags:
        - Billing
      parameters: []
      responses:
        "200":
          description: "{ url }"
        "401":
          description: Missing or invalid API key
        "404":
          description: No billing customer for that key
        "503":
          description: Billing not configured
      summary: Open billing portal
      description: Create a Stripe Customer Portal session for the key presented via
        `x-api-key`. Returns the hosted portal URL.
  /v1/billing/webhook:
    post:
      tags:
        - Billing
      parameters: []
      responses:
        "200":
          description: Acknowledged
        "400":
          description: Signature verification failed
      summary: Stripe webhook
      description: Internal Stripe webhook receiver. Not for public use.
  /v1/catalog/analyze:
    post:
      tags:
        - Catalog
      parameters: []
      responses:
        "200":
          description: Catalog analysis result (publisher → writer-IPI → ISWC graph).
        "400":
          description: Invalid body or no inputs provided.
        "503":
          description: Database unavailable.
      summary: Analyze an ISRC catalog (publisher → writer-IPI → ISWC graph)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isrcs:
                  type: array
                  items:
                    type: string
                  description: Flat ISRC list. Each becomes a 1-row 'song'. Use this for ad-hoc
                    'give me the publisher graph for these ISRCs' lookups.
                songs:
                  type: array
                  description: Pre-grouped Song No. structure. Use this to reproduce a publisher's
                    exact catalog grouping (writers, multiple ISRC variants per
                    song). Matches the shape `python3
                    scripts/catalog-extract.py` emits in the credits repo.
                  items:
                    type: object
                    required:
                      - songNo
                      - rows
                    properties:
                      songNo:
                        type: string
                      title:
                        type: string
                        nullable: true
                      writersRaw:
                        type: string
                        nullable: true
                      writers:
                        type: array
                        items:
                          type: string
                      rows:
                        type: array
                        items:
                          type: object
                          required:
                            - isrc
                          properties:
                            isrc:
                              type: string
                            artist:
                              type: string
                              nullable: true
                            recordingTitle:
                              type: string
                              nullable: true
                publisher_name_re:
                  type: string
                  description: Case-insensitive regex matching the target publisher's name in MLC.
                    Optional; when omitted, roster sections return empty arrays.
                enrich:
                  type: boolean
                  description: Default true. When true, unmatched ISRCs are queued for graph-link
                    enrichment as a side effect.
  /v1/compute/demand-bump:
    post:
      tags:
        - Credits Compute
      parameters: []
      responses:
        "200":
          description: "`{ ok: true }`. Repeat bumps are idempotent."
        "400":
          description: Invalid body
        "429":
          description: Rate limit exceeded
        "503":
          description: Database unavailable
      summary: Bump Credits Compute queue priority for an identifier
      description: "When `GET /v1/compute/unit` returns `{ unit: null }` for a
        `(task_type, anchor)` pair, the client POSTs here to upsert a
        high-priority `compute_queue` row (`reason=demand_lookup`, priority 10).
        Nightly seeders merge with `GREATEST(priority)`. Idempotent. No API key
        — same `session_id` as the unit loop. `anchor_type` is `iswc` for
        `crosslink_verify` / `composition_similarity`, `ipi` for `identity` /
        `writer_ipi` (`isni` also accepted for identity)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - session_id
                - task_type
                - anchor_type
                - anchor_id
              properties:
                session_id:
                  type: string
                  format: uuid
                task_type:
                  type: string
                  enum:
                    - composition_similarity
                    - identity
                    - crosslink_verify
                    - writer_ipi
                anchor_type:
                  type: string
                  enum:
                    - iswc
                    - ipi
                    - isni
                anchor_id:
                  type: string
  /v1/compute/result:
    post:
      tags:
        - Credits Compute
      parameters: []
      responses:
        "200":
          description: Processed. `verified` = correct control, `staged` = server-checked
            and awaiting consensus, `recorded` = stored without a merge-worthy
            link, `rejected` = failed verification, `invalid` = request/token
            could not be processed.
        "400":
          description: Invalid body
        "429":
          description: Rate limit exceeded
        "503":
          description: Database unavailable
      summary: Submit a Credits Compute work-unit result
      description: "Step 2 of 2. Submit one candidate ID from a unit returned by `GET
        /v1/compute/unit`. No API key; use the same `session_id` and unchanged
        opaque `unit_token`. `score` is required only for real
        `composition_similarity` units and optional for `identity`,
        `crosslink_verify`, `writer_ipi`, and hidden controls. The server
        recomputes the answer before it counts. `staged` means accepted for
        downstream consensus, not already public; `recorded` means stored
        without a merge-worthy link. Full status guide:
        `docs/VERIFY_AND_CONTRIBUTE.md`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - session_id
                - unit_token
                - winner_id
              properties:
                session_id:
                  type: string
                  format: uuid
                unit_token:
                  type: string
                winner_id:
                  type: string
                score:
                  type: number
                  description: Locally computed similarity score. Required for real
                    composition_similarity units; optional for identity,
                    crosslink_verify, writer_ipi, and hidden control units.
                signals:
                  type: object
                  description: Optional ranking signals persisted on the contribution
                    (observability). Staging uses the server recompute, not
                    these values.
                  properties:
                    ipi_overlap:
                      type: number
                    title_score:
                      type: number
                    writer_score:
                      type: number
                    name_overlap:
                      type: number
                    signal_tags:
                      type: array
                      items:
                        type: string
  /v1/compute/unit:
    get:
      tags:
        - Credits Compute
      parameters:
        - in: query
          name: session_id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: task_type
          required: false
          schema:
            type: string
            enum:
              - composition_similarity
              - identity
              - crosslink_verify
              - writer_ipi
        - in: query
          name: anchor
          required: false
          schema:
            type: string
          description: "Normalized PK for Demand-Directed Compute. `crosslink_verify` /
            `composition_similarity`: ISWC. `identity`: IPI or ISNI.
            `writer_ipi`: IPI. Combined with `task_type`, claims that queue row
            or returns `{ unit: null }`."
        - in: query
          name: prefer
          required: false
          schema:
            type: string
          description: Comma-separated task-type fallback list for the same anchor, e.g.
            `crosslink_verify,composition_similarity`. Tried after `task_type`.
      responses:
        "200":
          description: "`{ unit: { unit_token, task_type, anchor, candidates[] } }`, or `{
            unit: null }`. `unit_token` is opaque, session-bound, and submitted
            unchanged."
        "400":
          description: Missing or invalid session_id
        "429":
          description: Rate limit exceeded
        "503":
          description: Database unavailable
      summary: Get a Credits Compute work unit
      description: "Step 1 of 2. Issue one bounded candidate-matching unit; submit the
        answer to `POST /v1/compute/result`. No API key — persist one
        client-generated `session_id` UUID. Always inspect the returned
        `unit.task_type`: hidden `composition_similarity` controls can be
        returned even when a caller requests identity work **without** an
        anchor. With `task_type` + `anchor`, the unit matches that pair or is `{
        unit: null }` (then `POST /v1/compute/demand-bump`). Task rules:
        `composition_similarity` = same musical work, `identity` = IPI↔ISNI
        person/organization, `crosslink_verify` = ISWC↔ISRC recording link,
        `writer_ipi` = writer-name↔IPI. Full workflow:
        `docs/VERIFY_AND_CONTRIBUTE.md`."
  /v1/contribute:
    options:
      tags:
        - App Routes
      parameters: []
      responses:
        "200":
          description: OK
    post:
      tags:
        - Data contributions
      parameters: []
      responses:
        "201":
          description: 'Accepted. Response shape: `{ accepted, verified, no_match,
            pending, total, results }`. Per-item `status` is one of:
            `auto_accepted` (applied), `pending` (queued for review), `verified`
            (positive verification — cross-source agreement, sources merged,
            confidence bumped), `verified_already_recorded` (replay, no trust
            bump), `no_match` (negative verification — sources disagree or
            contributor explicitly asserted non-relationship; entry persisted to
            `*_index.conflicts[]`), `no_match_already_recorded` (replay),
            `rejected` (validation failure or non-internal-tier no_match). Sum
            `accepted + verified` for total positive verifications. New
            contribution `type: "no_match"` lets internal-tier contributors
            explicitly assert a value or relationship is wrong (works on any
            contributable field, including arrays). For unknown identifiers,
            fill_null/append/no_match create a sparse row so the contribution
            can land; correction on a missing row rejects.'
        "400":
          description: Invalid body
        "401":
          description: API key required or invalid
        "403":
          description: IP blocked
        "429":
          description: Rate limit exceeded
        "503":
          description: Database unavailable
      summary: Submit contributions
      description: >-
        Submit evidence your integration already has. Requires an **x-api-key**
        (`cfm_` prefix; create one with `POST /v1/keys`) and accepts at most 25
        items. Use `fill_null` for an empty scalar, `append` for an array,
        `correction` to propose replacing an existing value, or internal-only
        `no_match` for negative evidence. HTTP 201 means the batch was processed
        — inspect every `results[].status` to learn whether the item was
        applied, verified, queued, recorded as negative evidence, or rejected.
        Accepted ISRC↔ISWC links repair both read directions before the response
        returns. Full field/type/status guide: `docs/VERIFY_AND_CONTRIBUTE.md`.


        **Troubleshooting:** read endpoints do not validate API keys. If a
        lookup returns 200 but contribute returns 401, the key is missing,
        malformed, unknown, or revoked.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - contributions
              properties:
                contributions:
                  type: array
                  maxItems: 25
                  items:
                    type: object
                    properties:
                      target:
                        type: string
                        enum:
                          - isrc
                          - iswc
                          - ipi
                          - isni
                          - upc
                      id:
                        type: string
                      field:
                        type: string
                      value: {}
                      type:
                        type: string
                        enum:
                          - fill_null
                          - append
                          - correction
                          - no_match
                      citation:
                        type: string
                      notes:
                        type: string
